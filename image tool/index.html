<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Tools — Sign in</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <style>
    :root{--bg:#0f1117;--sur:#1a1d27;--sur2:#22263a;--border:#2e3350;--text:#e2e8f0;--text2:#8892b0;--accent:#4f7ef8;--red:#ef4444;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font:14px/1.5 'Segoe UI',sans-serif;min-height:100vh;
      display:grid;place-items:center;padding:16px;}
    .card{background:var(--sur);border:1px solid var(--border);border-radius:12px;padding:28px;width:100%;max-width:360px;
      display:flex;flex-direction:column;gap:12px;}
    h1{font-size:20px;} p{color:var(--text2);font-size:12px;}
    label{font-size:12px;color:var(--text2);display:flex;flex-direction:column;gap:4px;}
    input{background:var(--sur2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px;font-size:14px;}
    button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:11px;font-weight:600;cursor:pointer;font-size:14px;}
    button:disabled{opacity:.6;cursor:default;}
    .err{color:var(--red);font-size:13px;min-height:1.2em;}
    .hidden{display:none;}
  </style>
</head>
<body>
  <div class="card" id="busy"><h1>🛠️ Image Tools</h1><p id="busyMsg">Checking your sign-in…</p></div>

  <form class="card hidden" id="loginForm">
    <h1>🛠️ Image Tools</h1>
    <p>Sign in to continue</p>
    <label>Username<input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <div class="err" id="loginErr" role="alert"></div>
    <button id="loginBtn">Sign in</button>
  </form>

  <form class="card hidden" id="changeForm">
    <h1>Choose your password</h1>
    <p>Your password was set by an administrator. Choose your own — at least 10 characters.</p>
    <label>Current (temporary) password<input id="curPw" type="password" autocomplete="current-password" required></label>
    <label>New password<input id="newPw" type="password" autocomplete="new-password" minlength="10" required></label>
    <label>Repeat new password<input id="newPw2" type="password" autocomplete="new-password" minlength="10" required></label>
    <div class="err" id="changeErr" role="alert"></div>
    <button id="changeBtn">Save and continue</button>
  </form>

<script>
const SB_URL = 'https://fgxtaxdjqgmqrwgvjpwn.supabase.co';            // supabase/project.json "url"
const SB_KEY = 'sb_publishable_i2Tp40p0Q5ugF9WE9tp90A_sAkBrdVq';      // supabase/project.json "publishableKey"
const EMAIL_DOMAIN = 'users.pupik-tools.internal';                     // must equal rules.js EMAIL_DOMAIN
const MSG = {
  bad: 'Incorrect username or password.',
  revoked: 'Your access was removed. Contact your administrator.',
  down: "Can't reach the login service. Try again shortly.",
  betaOnly: 'The beta site is for administrators only.',
};

const $ = id => document.getElementById(id);
const host = location.hostname;
const LOCAL = (host === 'localhost' || host === '127.0.0.1') && new URLSearchParams(location.search).has('local');
const PAGE = host.startsWith('beta--') ? 'beta/index.html' : 'live/index.html';

function view(id, msg) {
  for (const v of ['busy', 'loginForm', 'changeForm']) $(v).classList.toggle('hidden', v !== id);
  if (id === 'busy' && msg) $('busyMsg').textContent = msg;
}
// After enter() writes the tools page, the shell's elements are gone.
function enable(id) { const el = $(id); if (el) el.disabled = false; }
function loginError(msg) { view('loginForm'); $('loginErr').textContent = msg; }
const isNetwork = e => !!e && (e.name === 'AuthRetryableFetchError' || e.name === 'StorageUnknownError'
  || e instanceof TypeError || /fetch|network/i.test(e.message ?? ''));

if (!window.supabase) {
  view('busy', MSG.down);
  throw new Error('supabase-js failed to load');
}
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { storageKey: 'pupik-tools-auth' } });

// supabase-js keeps the local session when the server already ended it; always drop it here.
async function clearSession() {
  try { await sb.auth.signOut({ scope: 'local' }); } catch {}
  localStorage.removeItem('pupik-tools-auth');
}

async function errorText(error) {
  try { return (await error.context.json()).error || MSG.down; } catch { return MSG.down; }
}

async function enter() {
  view('busy', 'Loading your tools…');
  const { data: profile, error } = await sb.from('profiles').select('*').maybeSingle();
  if (error) return loginError(MSG.down);
  if (!profile || !profile.active) { await clearSession(); return loginError(MSG.revoked); }
  if (profile.must_change_password) return view('changeForm');

  let html;
  if (LOCAL) {
    html = await (await fetch('../index.html', { cache: 'no-store' })).text();
  } else {
    const { data, error: dlErr } = await sb.storage.from('site').download(PAGE);
    if (dlErr) {
      if (isNetwork(dlErr)) return loginError(MSG.down);
      if (PAGE.startsWith('beta/')) return view('busy', MSG.betaOnly);
      await clearSession();
      return loginError(MSG.revoked);
    }
    html = await data.text();
  }
  document.open();
  document.write(html);
  document.close();
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginErr').textContent = '';
  $('loginBtn').disabled = true;
  try {
    const username = $('username').value.trim().toLowerCase();
    const { error } = await sb.auth.signInWithPassword({ email: `${username}@${EMAIL_DOMAIN}`, password: $('password').value });
    if (error) return loginError(isNetwork(error) ? MSG.down : error.code === 'user_banned' ? MSG.revoked : MSG.bad);
    $('curPw').value = $('password').value;
    await enter();
  } catch { loginError(MSG.down); }
  finally { enable('loginBtn'); }
});

$('changeForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('changeErr').textContent = '';
  if ($('newPw').value !== $('newPw2').value) { $('changeErr').textContent = 'The two new passwords do not match.'; return; }
  $('changeBtn').disabled = true;
  try {
    const { error } = await sb.functions.invoke('account', {
      body: { action: 'change_password', current: $('curPw').value, next: $('newPw').value },
    });
    if (error) { $('changeErr').textContent = await errorText(error); return; }
    await enter();
  } catch { $('changeErr').textContent = MSG.down; }
  finally { enable('changeBtn'); }
});

(async () => {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return view('loginForm');
    await enter();
  } catch { loginError(MSG.down); }
})();
</script>
</body>
</html>
